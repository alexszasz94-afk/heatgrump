<title>Frost Femme Princess Drop</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Inter:wght@400;500;600&display=swap">
<style>
/* Layout: a posting queue. Progress header, then one row per reel: video left, caption and actions right; stacks on phones. */
:root{
  --bg:#f3f5f8; --surface:#ffffff; --ink:#1b1d24; --muted:#5d6475; --line:#dde1ea;
  --accent:#7a1f35; --accent-ink:#ffffff; --done:#2f7a52; --done-bg:#e4f3ea;
  --display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --body:"Inter",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#12141a; --surface:#1b1e26; --ink:#eef0f5; --muted:#a2a9ba; --line:#2c303c;
  --accent:#d9677f; --accent-ink:#1b0a10; --done:#7fd3a3; --done-bg:#17301f; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12141a; --surface:#1b1e26; --ink:#eef0f5; --muted:#a2a9ba; --line:#2c303c;
  --accent:#d9677f; --accent-ink:#1b0a10; --done:#7fd3a3; --done-bg:#17301f; color-scheme:dark}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5}
.wrap{max-width:980px;margin:0 auto;padding-block:28px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:20px}
header{display:grid;gap:10px}
.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
h1{font-family:var(--display);font-weight:800;font-size:clamp(28px,5vw,40px);line-height:1.05;margin:0;text-wrap:balance}
.progress{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.bar{flex:1 1 220px;height:10px;border-radius:99px;background:var(--line);overflow:hidden}
.bar>i{display:block;height:100%;width:0;background:var(--done);transition:width .3s}
.count{font-variant-numeric:tabular-nums;font-weight:600}
.note{color:var(--muted);font-size:13px;margin:0}
.reel{display:grid;grid-template-columns:200px 1fr;gap:18px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px}
.reel.posted{border-color:var(--done)}
video{width:200px;max-width:100%;aspect-ratio:9/16;border-radius:10px;background:#000;display:block}
.info{display:grid;gap:10px;min-width:0;align-content:start}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap}
h2{font-family:var(--display);font-weight:600;font-size:20px;margin:0}
.meta{color:var(--muted);font-size:13px;margin:2px 0 0}
.check{display:flex;align-items:center;gap:8px;font-weight:600;cursor:pointer;padding:6px 12px;border-radius:99px;border:1px solid var(--line);user-select:none}
.check input{width:18px;height:18px;accent-color:var(--done)}
.posted .check{background:var(--done-bg);color:var(--done);border-color:var(--done)}
pre{margin:0;white-space:pre-wrap;word-break:break-word;font-family:var(--body);font-size:14px;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.actions{display:flex;gap:8px;flex-wrap:wrap}
button{font:600 14px var(--body);border-radius:10px;padding:9px 14px;cursor:pointer;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
button:focus-visible,.check:focus-within{outline:2px solid var(--accent);outline-offset:2px}
.msg{font-size:13px;color:var(--muted);min-height:1.2em}
@media (max-width:560px){.reel{grid-template-columns:1fr}video{width:100%;max-width:320px;margin:0 auto}}
@media (prefers-reduced-motion:reduce){.bar>i{transition:none}}
</style>

<div class="wrap">
  <header>
    <div class="eyebrow">Frost Femme · de postat azi, 25 nov · Black Friday</div>
    <h1>Princess problem, 8 reel-uri</h1>
    <div class="progress"><div class="bar"><i id="bar"></i></div><span class="count" id="count">0 / 8 postate</span></div>
    <p class="note" id="sync">Bifează „Postat” după ce urci reel-ul. Bifele se salvează.</p>
  </header>
  <main id="list" style="display:grid;gap:16px"></main>
</div>

<script>
const REELS=[
 {id:"v1",title:"Midnight, negru",meta:"Fata blondă · rochie verde + geacă scurtă → haina neagră",
  cap:"BLACK FRIDAY SALE: www.frostfemme.com\n\nEvery princess knows the problem: a ball gown and a puffer jacket just don't go together. So we made the coat that does. Corset waist, full skirt, warm enough for real winter. 🖤👑\n\n#frostfemme #princesscoat #corsetcoat #wintercoat #pufferdress #winterfashion #blackfriday #fyp"},
 {id:"v2",title:"Rose, roz",meta:"Fata cu bucle · rochie roz + geacă scurtă → haina roz",
  cap:"BLACK FRIDAY SALE: www.frostfemme.com\n\nThe princess problem: puffer on top, ball gown underneath, zero vibes. The fix is our pink corset coat-dress, fitted at the waist and flared like a gown. 🩷❄️\n\n#frostfemme #pinkcoat #princesscoat #corsetcoat #wintercoat #girlystyle #blackfriday #fyp"},
 {id:"v3",title:"Storm, gri",meta:"Fata platinată · rochie gri + geacă → haina gri",
  cap:"BLACK FRIDAY SALE: www.frostfemme.com\n\nI was tired of looking like a marshmallow in winter, so we made a coat that feels like a dress. Grey quilted corset coat, lace-up back, full skirt. 🩶✨\n\n#frostfemme #greycoat #corsetcoat #princesscoat #wintercoat #winteroutfit #blackfriday #fyp"},
 {id:"v4",title:"Frost, bleu",meta:"Roșcata · rochie bleu cu umbrela în vânt → haina bleu",
  cap:"BLACK FRIDAY SALE: www.frostfemme.com\n\nWhen the snow storm hits and you're still in your ball gown… The solution: a light blue corset coat-dress that keeps the princess silhouette and keeps you warm. 🩵❄️\n\n#frostfemme #bluecoat #princesscoat #corsetcoat #wintercoat #snowday #blackfriday #fyp"},
 {id:"v5",title:"Cocoa, ciocolatiu",meta:"Bruneta · rochie aurie cu umbrela → haina ciocolatie",
  cap:"BLACK FRIDAY SALE: www.frostfemme.com\n\nNo princess should fight a snow storm with an umbrella. Our chocolate corset coat-dress is warm, cinched at the waist and made for twirling. 🤎👑\n\n#frostfemme #browncoat #chocolatecoat #corsetcoat #princesscoat #wintercoat #blackfriday #fyp"},
 {id:"v6",title:"Cherry, vișiniu",meta:"Bruneta cu breton · rochie verde cu umbrela → haina vișinie",
  cap:"BLACK FRIDAY SALE: www.frostfemme.com\n\nThe princess problem: gorgeous dress, freezing weather. So I made my own coat. Burgundy, quilted, corset waist and a skirt that moves like a gown. ❤️❄️\n\n#frostfemme #burgundycoat #corsetcoat #princesscoat #wintercoat #christmasoutfit #blackfriday #fyp"},
 {id:"v7",title:"Snow, alb-lapte",meta:"Șatena · pulover + geacă peste rochie → haina albă",
  cap:"BLACK FRIDAY SALE: www.frostfemme.com\n\nSweater + puffer over a ball gown? Not the look. Our milk white corset coat-dress gives you the whole princess silhouette in one piece. 🤍✨\n\n#frostfemme #whitecoat #corsetcoat #princesscoat #wintercoat #winterwhite #blackfriday #fyp"},
 {id:"v8",title:"Midnight, negru (ușa)",meta:"Bruneta · iese în rochie roșie pe zăpadă și fuge înapoi → haina neagră",
  cap:"BLACK FRIDAY SALE: www.frostfemme.com\n\nOne step outside in my ball gown and I ran straight back in. 🥶 So we made a coat for princesses: black, quilted, corset waist, full skirt. 🖤\n\n#frostfemme #blackcoat #corsetcoat #princesscoat #wintercoat #winterfashion #blackfriday #fyp"}
];
let state={}; try{state=JSON.parse(localStorage.getItem("posted-25nov")||"{}")}catch(e){}
let ref=null, downloads=null;
const list=document.getElementById("list");
function render(){
  let n=0;
  REELS.forEach(r=>{
    const el=document.getElementById("r-"+r.id), on=!!state[r.id]; if(on)n++;
    el.classList.toggle("posted",on); el.querySelector("input").checked=on;
  });
  document.getElementById("count").textContent=n+" / "+REELS.length+" postate";
  document.getElementById("bar").style.width=(n/REELS.length*100)+"%";
}
REELS.forEach((r,i)=>{
  const a=document.createElement("article"); a.className="reel"; a.id="r-"+r.id;
  a.innerHTML=`<video controls playsinline preload="none" poster="videos/${r.id}.jpg" src="videos/${r.id}.mp4"></video>
  <div class="info"><div class="top"><div><h2></h2><p class="meta"></p></div>
  <label class="check"><input type="checkbox" id="chk-${r.id}"> Postat</label></div>
  <pre></pre>
  <div class="actions"><button class="primary" data-act="dl">Descarcă MP4</button><button data-act="copy">Copiază caption</button></div>
  <div class="msg" aria-live="polite"></div></div>`;
  a.querySelector("h2").textContent=(i+1)+". "+r.title;
  a.querySelector(".meta").textContent=r.meta;
  a.querySelector("pre").textContent=r.cap;
  const msg=a.querySelector(".msg");
  a.querySelector("input").addEventListener("change",e=>{
    state={...state,[r.id]:e.target.checked};
    try{localStorage.setItem("posted-25nov",JSON.stringify(state))}catch(_){}
    render();
    if(ref) ref.set({posted:state}).catch(()=>{document.getElementById("sync").textContent="Bifa s-a salvat doar pe acest dispozitiv."});
  });
  a.querySelector('[data-act="copy"]').addEventListener("click",()=>{
    navigator.clipboard.writeText(r.cap).then(()=>{msg.textContent="Caption copiat."}).catch(()=>{
      const s=window.getSelection(),rg=document.createRange();rg.selectNodeContents(a.querySelector("pre"));s.removeAllRanges();s.addRange(rg);msg.textContent="Textul e selectat, copiază-l manual.";});
  });
  a.querySelector('[data-act="dl"]').addEventListener("click",async()=>{
    if(!downloads){msg.textContent="Descărcarea nu merge aici. Deschide pagina în browser pe claude.ai.";return}
    msg.textContent="Se pregătește fișierul…";
    try{const b=await (await fetch("videos/"+r.id+".mp4")).blob();
      await downloads.save({filename:"frostfemme-princess-"+r.id+".mp4",data:b});msg.textContent="Salvat.";}
    catch(e){msg.textContent=e&&e.code==="declined"?"Descărcare anulată.":"Nu s-a putut descărca ("+(e&&e.code||"eroare")+").";}
  });
  list.appendChild(a);
});
render();
(async()=>{
  try{downloads=await window.claude?.use("downloads")}catch(e){}
  try{
    const db=await window.claude?.use("db");
    if(db){ref=db.doc("checklist/2026-11-25");
      ref.onSnapshot(s=>{if(s.exists&&s.data().posted){state=s.data().posted;render();}},()=>{});}
  }catch(e){}
})();
</script>
