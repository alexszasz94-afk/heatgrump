<title>HeatGrump Lot Nou</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,800&family=Figtree:wght@400;500;600&display=swap">
<style>
/* Layout: un rând de cartonașe verticale (ca telefonul), fiecare reel = video + fișa lui; se strâng la o coloană pe telefon */
:root{
  --bg:#f6f4ef; --card:#ffffff; --fg:#1f2620; --muted:#5f6a61; --line:#e2ddd2;
  --pine:#2f5a3a; --berry:#b0283a; --chip:#e9efe7;
  --display:"Fraunces", Georgia, serif; --body:"Figtree", system-ui, -apple-system, sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141814; --card:#1d221d; --fg:#ecefe8; --muted:#a3ac9f; --line:#2d342c;
  --pine:#8cc79b; --berry:#ef7182; --chip:#25302a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141814; --card:#1d221d; --fg:#ecefe8; --muted:#a3ac9f; --line:#2d342c;
  --pine:#8cc79b; --berry:#ef7182; --chip:#25302a; color-scheme:dark}
body{background:var(--bg);color:var(--fg);font:15px/1.5 var(--body)}
.wrap{max-width:1180px;margin:0 auto;padding-inline:16px;padding-block:28px 48px}
header{display:grid;gap:6px;margin-bottom:22px}
h1{font:800 clamp(28px,5vw,40px)/1.05 var(--display);margin:0;color:var(--pine);text-wrap:balance}
.sub{color:var(--muted);max-width:68ch;margin:0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:18px}
.reel{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:grid;grid-template-rows:auto 1fr;min-width:0}
video{display:block;width:100%;aspect-ratio:9/16;max-width:100%;background:#000;object-fit:cover}
.info{display:grid;gap:10px;padding:14px 14px 16px;align-content:start;min-width:0}
.top{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
h2{font:600 22px/1.1 var(--display);margin:0}
.len{color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
.tag{display:inline-block;font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--berry);background:var(--chip);border-radius:999px;padding:2px 9px;width:fit-content}
dl{margin:0;display:grid;gap:6px}
dt{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
dd{margin:0 0 4px;overflow-wrap:anywhere}
.cap{background:var(--chip);border-radius:8px;padding:8px 10px;font-size:14px}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:2px}
button{font:600 14px var(--body);border-radius:9px;padding:9px 14px;cursor:pointer;border:1px solid var(--pine)}
.dl{background:var(--pine);color:var(--card)}
.cp{background:transparent;color:var(--pine)}
button:focus-visible{outline:3px solid var(--berry);outline-offset:2px}
.msg{font-size:13px;color:var(--muted);min-height:1.2em}
</style>

<div class="wrap">
  <header>
    <h1>Lotul nou · reel 18–23</h1>
    <p class="sub">Ultimele videouri, în stilul princesscomfortt: hook-uri de pe contul lor, B2 cu fața la vedere, textul în fontul lor și melodiile tale de Crăciun. Fiecare are buton de descărcare și caption gata de copiat.</p>
  </header>
  <main class="grid" id="grid"></main>
</div>

<script>
const REELS = [
  {n:23, tag:"Copie 1:1", len:"16,8 s", hook:"Copie după reel-ul lor DeDAprJSrPO (702k): ține halatul împăturit întins, „3, 2, 1”, apoi îl lasă să cadă. Aceleași tăieturi ca la ei.", music:"Vocea noastră „Three! Two! One!” + Mariah Carey", text:"I made this for the cold-aholics.. 🤩💕", caption:"Made for the cold-aholics 🤩🎄 #grinch #wearableblanket #christmasgift #cozy"},
  {n:20, tag:"Hook 3-2-1", len:"16,7 s", hook:"Din reel-ul de referință (702k): halatul întins ca un banner, numărătoarea „3, 2, 1”, apoi cade. B2 nou, filmat din cap până în picioare.", music:"Wham! – Last Christmas", text:"I made this for the cold-aholics.. 🤩💕", caption:"Made for the cold-aholics 🤩🎄 #grinch #wearableblanket #christmasgift #cozy"},
  {n:19, tag:"Cel mai viral", len:"15,9 s", hook:"Angajații magazinului trag pânza de pe masă și apar halatele (6,7 mil. la ei).", music:"Mariah Carey – All I Want for Christmas", text:"GRINCH ROBE DROP 😳🎄", caption:"The Grinch robe drop is here 😳🎄 #grinch #wearableblanket #heatedrobe #christmas #cozy"},
  {n:21, tag:"Bărbat", len:"16,1 s", hook:"El scoate halatul „copt” pe tavă ca un chef, prietena râde (121k la ei). Cozy refăcut.", music:"Michael Bublé – It's Beginning to Look a Lot Like Christmas", text:"Don't let your girlfriend know about this 🤭💕", caption:"Freshly baked and fully heated 🤭🎄 #grinch #heatedrobe #giftforhim #christmas #cozy"},
  {n:18, tag:"Hook nou", len:"15,1 s", hook:"Scutură halatul deasupra capului, apoi îl lasă să cadă (102k la ei).", music:"Michael Bublé – It's Beginning to Look a Lot Like Christmas", text:"Don't show this to a Grinch mom… 🥺✨", caption:"Every Grinch mom needs this 🥺🎄 #grinch #wearableblanket #heatedrobe #christmas #cozy"},
  {n:22, tag:"Dormitor", len:"15,3 s", hook:"Din ochii ei: împinge halatul rulat pe pat și se desface (147k la ei).", music:"Mariah Carey – All I Want for Christmas", text:"DO NOT show this to your mom 😱😬…", caption:"Mom will steal it 😱🎄 #grinch #wearableblanket #christmasgift #cozy"},
];

const grid = document.getElementById("grid");
for (const r of REELS) {
  const el = document.createElement("article");
  el.className = "reel";
  el.innerHTML = `
    <video controls playsinline preload="metadata" poster="poster${r.n}.jpg" src="reel${r.n}.mp4"></video>
    <div class="info">
      <div class="top"><h2>Reel ${r.n}</h2><span class="len">${r.len}</span></div>
      <span class="tag"></span>
      <dl>
        <dt>Hook</dt><dd class="h"></dd>
        <dt>Muzică</dt><dd class="m"></dd>
        <dt>Text pe ecran</dt><dd class="t"></dd>
        <dt>Caption</dt><dd class="cap"></dd>
      </dl>
      <div class="btns">
        <button class="dl" type="button">Descarcă video</button>
        <button class="cp" type="button">Copiază caption</button>
      </div>
      <div class="msg" aria-live="polite"></div>
    </div>`;
  el.querySelector(".tag").textContent = r.tag;
  el.querySelector(".h").textContent = r.hook;
  el.querySelector(".m").textContent = r.music;
  el.querySelector(".t").textContent = r.text;
  el.querySelector(".cap").textContent = r.caption;
  const msg = el.querySelector(".msg");
  el.querySelector(".cp").addEventListener("click", async () => {
    try { await navigator.clipboard.writeText(r.caption); msg.textContent = "Caption copiat."; }
    catch { const s = getSelection(), rg = document.createRange(); rg.selectNodeContents(el.querySelector(".cap")); s.removeAllRanges(); s.addRange(rg); msg.textContent = "Am selectat caption-ul: apasă Copiază."; }
  });
  el.querySelector(".dl").addEventListener("click", async () => {
    msg.textContent = "Pregătesc fișierul…";
    try {
      const downloads = await claude.use("downloads");
      if (!downloads) { msg.textContent = "Descărcarea nu merge în această vedere. Deschide pagina în claude.ai."; return; }
      const blob = await (await fetch(`reel${r.n}.mp4`)).blob();
      await downloads.save({ filename: `heatgrump-reel${r.n}.mp4`, data: blob });
      msg.textContent = "Salvat.";
    } catch (e) {
      msg.textContent = e && e.code === "declined" ? "Descărcare anulată." : "Nu s-a putut descărca. Încearcă din nou.";
    }
  });
  grid.appendChild(el);
}
</script>
